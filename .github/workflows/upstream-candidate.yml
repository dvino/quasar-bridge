name: upstream candidate

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-candidate
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'dvino/quasar-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.merge.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Merge stable upstream into an isolated candidate branch
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/skrashevich/quasar-bridge/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Unexpected upstream tag'; exit 1; }
          git fetch https://github.com/skrashevich/quasar-bridge.git "refs/tags/$tag"
          upstream=$(git rev-parse 'FETCH_HEAD^{commit}')
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo 'Stable upstream is already integrated.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="candidate/upstream-$tag"
          git switch -c "$branch"
          # A conflict fails the job; main, releases and devices remain unchanged.
          git merge --no-edit "$upstream"
          # Never overwrite an earlier candidate or its review history.
          git push origin "HEAD:refs/heads/$branch"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    if: needs.prepare.outputs.revision != ''
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.prepare.outputs.revision }}
      upload-speaker: true
